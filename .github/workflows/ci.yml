name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target family to run (matches src/ hierarchy)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - android
          - android-native
      platform:
        description: "Platform runner / architecture slice (e.g. androidNativeArm64 for android-native)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - androidNativeArm64
          - androidNativeX64
      phase:
        description: "Execution phase (build, test, or both)"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  android:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'android') &&
      (inputs.platform == '' || inputs.platform == 'all')
    uses: ./.github/workflows/android.yml
    with:
      platform: ${{ inputs.platform || 'all' }}
      phase: ${{ inputs.phase || 'build-and-test' }}
    permissions:
      contents: read

  android-native:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'android-native') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'androidNativeArm64' || inputs.platform == 'androidNativeX64')
    uses: ./.github/workflows/android-native.yml
    with:
      platform: ${{ inputs.platform || 'all' }}
      phase: ${{ inputs.phase || 'build-and-test' }}
    permissions:
      contents: read
