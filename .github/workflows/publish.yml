name: Publish to Maven Central

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and release to Maven Central (requires secrets)"
        type: boolean
        required: false
        default: false

# Publishing targets Maven Central via the Sonatype Central Portal using external secrets;
# no GitHub-side write permissions are needed. Checkout only requires read.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: ./gradlew setupAndroidSdk compileAndroidMain androidSourcesJar --no-daemon --max-workers=2 --no-configuration-cache

      - name: Publish to Maven Central
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: ./gradlew setupAndroidSdk publishToCentralPortal -PcentralPublishingType=AUTOMATIC --no-daemon --max-workers=2 --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
