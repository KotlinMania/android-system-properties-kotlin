name: Publish to Maven Central

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and release to Maven Central (requires secrets)"
        type: boolean
        required: false
        default: false

# Publishing targets Maven Central via the Sonatype Central Portal using external secrets;
# no GitHub-side write permissions are needed. Checkout only requires read.
permissions:
  contents: read

jobs:
  android-device-test:
    name: Verify Android Emulator Device Tests
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Run Android emulator device tests (KVM)
        run: ./gradlew setupAndroidSdk verifyAndroidDeviceTestResults validateAndroidNativeX64Runtime --no-configuration-cache
      - name: Upload verified Android device test results
        uses: actions/upload-artifact@v7
        with:
          name: android-device-test-results
          path: build/outputs/androidTest-results/connected/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to Maven Central
    needs: [android-device-test]
    if: ${{ always() && (needs.android-device-test.result == 'success' || needs.android-device-test.result == 'skipped') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        # Keep workflow_dispatch safe (no publishing), and verify Android JVM + Native builds.
        run: ./gradlew setupAndroidSdk build checkPublicationPoms --no-configuration-cache

      - name: Download verified Android device test results
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: actions/download-artifact@v8
        with:
          name: android-device-test-results
          path: build/outputs/androidTest-results/connected

      - name: Publish to Maven Central
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: ./gradlew setupAndroidSdk publishToCentralPortal -PcentralPublishingType=AUTOMATIC --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
