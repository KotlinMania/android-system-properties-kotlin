name: Build and execute Android x64

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Android API 35 x64 runtime
    runs-on: macos-15-intel
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_AVD_HOME: ${{ github.workspace }}/build/ci-avd
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Record unprivileged Intel host diagnostics
        run: |
          set -euo pipefail
          mkdir -p build/reports/runtime
          {
            uname -a
            sw_vers
            sysctl kern.hv_support
            test "$(uname -m)" = x86_64
          } 2>&1 | tee build/reports/runtime/android-x64-host.txt

      - name: Compile, test host behavior, and verify Android publication
        run: >
          ./gradlew setupAndroidSdk compileAndroidMain compileAndroidDeviceTest
          assembleUnitTest assembleAndroidTest hostTests ktlintCheck detekt
          verifyAndroidArtifact linkDebugTestAndroidNativeX64
          --no-daemon --max-workers=2 --no-configuration-cache

      - name: Install isolated Android API 35 x64 runtime
        run: |
          set -euo pipefail
          # ATD omits bundled apps seen in first-boot dexopt; API/ABI and real tests stay required.
          .android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" 'emulator' 'system-images;android-35;aosp_atd;x86_64'
          .android-sdk/emulator/emulator -accel-check 2>&1 | tee build/reports/runtime/android-x64-acceleration.txt
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | .android-sdk/cmdline-tools/latest/bin/avdmanager create avd --name android-properties-ci-api35 --package 'system-images;android-35;aosp_atd;x86_64'

      - name: Boot only the isolated x64 emulator
        run: |
          set -euo pipefail
          if .android-sdk/platform-tools/adb devices | tail -n +2 | grep -q '[^[:space:]]'; then
            echo 'Unexpected existing Android device; refusing to claim it.'
            exit 1
          fi
          # Kernel output uses stdio; collect guest logcat through bounded ADB probes.
          .android-sdk/emulator/emulator -avd android-properties-ci-api35 -port 5554 -accel on -no-window -no-audio -no-snapshot -no-boot-anim -cores 2 -memory 2048 -gpu swiftshader_indirect -verbose -show-kernel > build/android-x64-emulator.log 2>&1 &
          export PROPERTIES_EMULATOR_PID=$!
          echo "PROPERTIES_EMULATOR_PID=$PROPERTIES_EMULATOR_PID" >> "$GITHUB_ENV"
          ./gradlew -p buildSrc runBuildTool --args="AndroidEmulatorEvidence boot --adb .android-sdk/platform-tools/adb --serial emulator-5554 --avd android-properties-ci-api35 --pid $PROPERTIES_EMULATOR_PID --report-dir build/reports/runtime/android-x64-boot" --no-daemon --console=plain
          ./gradlew -p buildSrc runBuildTool --args="AndroidEmulatorEvidence identity --adb .android-sdk/platform-tools/adb --serial emulator-5554 --avd android-properties-ci-api35 --api 35 --abi x86_64 --output build/reports/runtime/androidNativeX64-device.json" --no-daemon --console=plain

      - name: Execute real instrumentation and Android Native x64 tests
        run: >
          ./gradlew connectedAndroidDeviceTest androidNativeX64DeviceTest
          -Pandroid.injected.device.serial=emulator-5554
          -PandroidNativeX64.deviceSerial=emulator-5554
          --no-daemon --max-workers=2 --no-configuration-cache

      - name: Verify named execution and exact device binary
        run: |
          set -euo pipefail
          ./gradlew -p buildSrc runBuildTool --args="AndroidEmulatorEvidence hash --adb .android-sdk/platform-tools/adb --serial emulator-5554 --identity build/reports/runtime/androidNativeX64-device.json --binary /data/local/tmp/android-system-properties-androidNativeX64-test" --no-daemon --console=plain
          ./gradlew -p buildSrc runBuildTool --args="AndroidRuntimeResultsVerifier androidNativeX64 --device-identity build/reports/runtime/androidNativeX64-device.json --expected-avd android-properties-ci-api35" --no-daemon --console=plain

      - name: Upload actual execution and publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-x64-runtime-evidence
          path: |
            build/test-results/
            build/outputs/androidTest-results/
            build/reports/runtime/
            build/reports/publication/
            build/android-x64-emulator.log
            build/bin/androidNativeX64/debugTest/test.kexe
          retention-days: 7
          if-no-files-found: error

      - name: Stop only the owned emulator
        if: always() && env.PROPERTIES_EMULATOR_PID != ''
        run: |
          set -euo pipefail
          properties_avd=$(.android-sdk/platform-tools/adb -s emulator-5554 emu avd name | head -n 1 | tr -d '\r')
          test "$properties_avd" = android-properties-ci-api35
          .android-sdk/platform-tools/adb -s emulator-5554 emu kill
