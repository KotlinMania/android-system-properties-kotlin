name: Build (Android Native)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Compile both Android Native ABIs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Runtime x64 execution is required by android.yml. Both ABIs compile here;
      # ARM64 runtime evidence is verified separately on an owned ARM64 device.
      - name: Compile Android Native targets
        run: >
          ./gradlew
          compileKotlinAndroidNativeArm64
          compileKotlinAndroidNativeX64
          linkDebugTestAndroidNativeArm64
          linkDebugTestAndroidNativeX64
          --no-daemon --max-workers=2 --no-configuration-cache
